<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅遊景點候選清單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F1E2; --ink:#23301F; --ink-soft:#5B6650;
    --forest:#2E5C42; --forest-deep:#1F4732; --gold:#D69A32;
    --coral:#C85A3A; --teal:#3D7A80; --line:#D8CDAE; --white:#FFFDF7;
    --bad:#B04A3B; --good:#2E5C42;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:"Work Sans",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:"Fraunces",serif;font-weight:600;color:var(--forest-deep);margin:0;}
  a{color:var(--teal);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:14px;}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px 80px;}
  .hidden{display:none !important;}

  header{padding:36px 0 20px;border-bottom:1px solid var(--line);}
  header h1{font-size:clamp(28px,5vw,40px);}
  .header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .me{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .me input{border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:var(--white);width:120px;}
  .admin-toggle{font-size:12px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:20px;padding:4px 12px;}
  .admin-toggle.on{color:var(--white);background:var(--forest);border-color:var(--forest);}
  .admin-login{display:flex;gap:6px;align-items:center;}
  .admin-login input{border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:var(--white);width:110px;font-size:13px;}
  .admin-login .btn{padding:6px 12px;font-size:12.5px;}

  .tabs{display:flex;gap:4px;margin-top:22px;flex-wrap:wrap;}
  .tab{padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--white);color:var(--ink-soft);font-size:13.5px;font-weight:600;}
  .tab.active{background:var(--forest);color:var(--white);border-color:var(--forest);}

  .panel{display:none;padding-top:28px;}
  .panel.active{display:block;}

  .card-box{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--forest);padding:22px 24px;border-radius:2px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-top:14px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px;font-weight:600;color:var(--forest);}
  .field .hint{font-size:11px;color:var(--ink-soft);font-weight:400;}
  .field input,.field textarea,.field select{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--cream);}
  .field textarea{resize:vertical;min-height:60px;}
  .unit-input{display:flex;align-items:center;gap:6px;}
  .unit-input input{width:80px;}
  @media(max-width:600px){.field-grid{grid-template-columns:1fr;}}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:20px;padding:9px 18px;font-size:13.5px;font-weight:600;}
  .btn-primary{background:var(--forest);color:var(--white);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}
  .btn-danger{background:transparent;border:1px solid #E8CFC0;color:var(--bad);}
  .btn:disabled{opacity:0.5;cursor:default;}
  .save-row{margin-top:16px;display:flex;align-items:center;gap:10px;}
  .save-msg{font-size:12.5px;color:var(--forest);}

  .subtabs{display:flex;gap:8px;margin-top:18px;}
  .subtab{padding:7px 16px;border-radius:20px;border:1px solid var(--line);background:var(--cream);color:var(--ink-soft);font-size:13px;font-weight:600;}
  .subtab.active{background:var(--gold);color:var(--white);border-color:var(--gold);}

  .list-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;}
  .list-toolbar p{color:var(--ink-soft);font-size:13px;margin:0;}
  .sort-wrap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}
  .sort-wrap select{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--white);}
  .sort-dir{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-size:13px;color:var(--ink-soft);}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px;}
  @media(max-width:680px){.cards{grid-template-columns:1fr;}}
  .spot{background:var(--white);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;}
  .spot .photo{width:100%;height:150px;background:linear-gradient(135deg,#E7DFC7,#D8CDAE);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;overflow:hidden;position:relative;}
  .spot .photo img{width:100%;height:100%;object-fit:cover;}
  .spot .photo.clickable{cursor:zoom-in;}
  .spot .photo .count-badge{position:absolute;bottom:6px;right:6px;background:rgba(20,20,15,0.6);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;display:flex;align-items:center;gap:4px;}

  .lightbox{position:fixed;inset:0;background:rgba(15,18,12,0.92);display:none;align-items:center;justify-content:center;z-index:80;}
  .lightbox.active{display:flex;}
  .lightbox img{max-width:88vw;max-height:80vh;object-fit:contain;border-radius:2px;}
  .lightbox .lb-close{position:absolute;top:18px;right:22px;background:none;border:none;color:#fff;font-size:28px;line-height:1;padding:6px;}
  .lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .lightbox .lb-prev{left:16px;}
  .lightbox .lb-next{right:16px;}
  .lightbox .lb-counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;opacity:0.85;}
  .spot .body{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column;}
  .spot h4{font-size:18px;}
  .spot .addr{font-size:12px;color:var(--ink-soft);margin:3px 0 8px;}
  .spot .blurb{font-size:13.5px;white-space:pre-line;flex:1;}
  .blurb .hl-red{color:var(--bad);font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .chip{font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;background:var(--cream);}
  .chip.price{color:var(--coral);border-color:#E8CFC0;background:#FBF2ED;}
  .chip.time{color:var(--forest);border-color:#CBDDCF;background:#F0F6F1;}
  .chip.drive{color:var(--teal);border-color:#CBE0E1;background:#EFF6F6;}
  .chip.indoor{color:#7B5FA0;border-color:#DCD2EA;background:#F4F0F9;}
  .links-row{display:flex;gap:14px;margin-top:10px;font-size:12.5px;}
  .links-row a{display:flex;align-items:center;gap:4px;text-decoration:none;}
  .links-row svg{width:14px;height:14px;}

  .vote-row{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .vote-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:6px;padding:7px 4px;background:var(--white);font-size:12px;color:var(--ink-soft);}
  .vote-btn .n{font-family:"Fraunces",serif;font-size:16px;font-weight:600;color:var(--ink);}
  .vote-btn.yes.selected{background:#EEF5EF;border-color:var(--good);color:var(--good);}
  .vote-btn.yes.selected .n{color:var(--good);}
  .vote-btn.no.selected{background:#FBEFEC;border-color:var(--bad);color:var(--bad);}
  .vote-btn.no.selected .n{color:var(--bad);}
  .vote-btn.neutral.selected{background:#FBF3E4;border-color:var(--gold);color:var(--gold);}
  .vote-btn.neutral.selected .n{color:var(--gold);}
  .card-tools{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
  .icon-btn{background:none;border:none;color:var(--ink-soft);font-size:12px;padding:2px 4px;}
  .icon-btn:hover{color:var(--forest);}

  .overlay{position:fixed;inset:0;background:rgba(30,35,25,0.4);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .overlay.active{display:flex;}
  .modal{background:var(--white);border-radius:6px;max-width:600px;width:100%;padding:26px 28px 24px;}
  .modal h3{font-size:20px;margin-bottom:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .photo-upload{display:flex;align-items:center;gap:10px;}
  .photo-upload .preview{width:56px;height:56px;border-radius:4px;background:var(--cream);border:1px solid var(--line);overflow:hidden;flex:none;}
  .photo-upload .preview img{width:100%;height:100%;object-fit:cover;}
  .photo-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .photo-list .thumb{position:relative;width:64px;height:64px;border-radius:4px;overflow:hidden;border:1px solid var(--line);flex:none;}
  .photo-list .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-list .thumb .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(20,20,15,0.65);color:#fff;border:none;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
  .photo-add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .photo-add-row input[type="url"]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--cream);}
  .photo-add-row input[type="file"]{font-size:12.5px;max-width:180px;}
  .type-pick{display:flex;gap:8px;}
  .type-pick button{flex:1;border:1px solid var(--line);background:var(--cream);border-radius:4px;padding:8px;font-size:13.5px;color:var(--ink-soft);font-weight:600;}
  .type-pick button.active{background:var(--forest);color:var(--white);border-color:var(--forest);}

  .empty{color:var(--ink-soft);font-size:14px;margin-top:24px;text-align:center;padding:40px 0;border:1px dashed var(--line);border-radius:6px;}

  .stat-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .stat-row:last-child{border-bottom:none;}
  .stat-name{flex:1;min-width:0;}
  .stat-name h4{font-size:15.5px;}
  .stat-name .who{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .bar-wrap{width:130px;height:8px;background:var(--line);border-radius:6px;overflow:hidden;flex:none;display:flex;}
  .bar-yes{background:var(--good);height:100%;}
  .bar-neutral{background:var(--gold);height:100%;}
  .bar-no{background:var(--bad);height:100%;}
  .stat-score{width:64px;text-align:right;font-family:"Fraunces",serif;font-weight:600;flex:none;}
  .stat-group-label{font-size:12px;font-weight:600;color:var(--forest);margin:18px 0 4px;}
  .stat-group-label:first-child{margin-top:0;}

  .danger-zone{margin-top:36px;border-top:1px solid var(--line);padding-top:20px;}
  .danger-zone h3{font-size:15px;color:var(--bad);}
  .danger-zone p{font-size:13px;color:var(--ink-soft);margin:6px 0 12px;}

  .loading{padding:60px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--forest-deep);color:var(--white);padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;}
  .toast.show{opacity:1;}

  .back-to-top{position:fixed;right:20px;bottom:26px;width:46px;height:46px;border-radius:50%;background:var(--forest);color:var(--white);border:none;font-size:20px;box-shadow:0 4px 14px rgba(30,50,35,0.28);opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s, transform .2s;z-index:60;}
  .back-to-top.show{opacity:0.92;pointer-events:auto;transform:translateY(0);}
  .back-to-top:active{opacity:1;}

  .list-progress{font-size:12.5px;color:var(--ink-soft);margin-top:10px;display:flex;align-items:center;gap:8px;}
  .list-progress .bar{flex:1;max-width:160px;height:6px;background:var(--line);border-radius:6px;overflow:hidden;}
  .list-progress .bar-fill{height:100%;background:var(--gold);}

  .next-cta{margin-top:22px;background:var(--white);border:1px dashed var(--line);border-radius:6px;padding:20px;text-align:center;}
  .next-cta p{font-size:14px;color:var(--ink-soft);margin:0 0 12px;}
</style>
</head>
<body>

<svg style="display:none">
  <symbol id="ic-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5-2V4l5 2 6-2 5 2v14l-5-2-6 2z"/><path d="M9 6v14M15 4v14"/></symbol>
  <symbol id="ic-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ic-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
</svg>

<div class="wrap">
  <header>
    <div class="header-row">
      <div>
        <h1 id="tripTitle">旅遊景點候選清單</h1>
        <div id="tripDatesText" style="margin-top:8px;color:var(--ink-soft);font-size:14px;"></div>
      </div>
      <div class="header-right">
        <button class="admin-toggle" id="adminToggle">管理模式</button>
        <div class="admin-login hidden" id="adminLogin">
          <input type="password" id="adminPwInput" placeholder="輸入管理密碼">
          <button class="btn btn-primary" id="adminPwConfirm">確認</button>
          <button class="btn btn-ghost" id="adminPwCancel">取消</button>
        </div>
        <div class="me">
          你的名字
          <input id="meName" type="text" placeholder="輸入你的名字" maxlength="12">
        </div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="list">景點清單</button>
      <button class="tab" data-tab="stats">統計總覽</button>
      <button class="tab admin-only hidden" data-tab="settings">行程設定</button>
    </div>
  </header>

  <div id="loading" class="loading">載入中…</div>

  <div class="panel active" id="panel-list">
    <div id="stayCardWrap"></div>
    <div class="subtabs">
      <button class="subtab active" data-type="play">玩的</button>
      <button class="subtab" data-type="food">吃的</button>
    </div>
    <div class="list-toolbar">
      <p id="listCount"></p>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="sort-wrap">
          排序
          <select id="sortKey">
            <option value="name">名稱</option>
            <option value="drive" selected>距離民宿車程</option>
            <option value="driveLuzhou">距離蘆洲車程</option>
            <option value="time">預計可停留時間</option>
          </select>
        </div>
        <button class="sort-dir" id="sortDir" title="切換排序方向">↑ 由小到大</button>
        <button class="btn btn-primary admin-only hidden" id="btnAdd">＋ 新增地點</button>
      </div>
    </div>
    <div class="list-progress" id="listProgress"></div>
    <div class="cards" id="cardsWrap"></div>
    <div class="empty" id="emptyMsg" style="display:none;"></div>
    <div class="next-cta" id="nextCta"></div>
  </div>

  <div class="panel" id="panel-stats">
    <h2>統計總覽</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:4px;">依「感興趣減沒興趣」的淨分數，由高到低排序。</p>
    <div class="subtabs">
      <button class="subtab active" data-stat-type="play">玩的</button>
      <button class="subtab" data-stat-type="food">吃的</button>
    </div>
    <div class="card-box" style="margin-top:16px;" id="statsWrap"></div>
  </div>

  <div class="panel" id="panel-settings">
    <h2>行程設定</h2>
    <div class="card-box" style="margin-top:16px;">
      <div class="field-grid">
        <div class="field"><label>出發日期</label><input type="date" id="setStart"></div>
        <div class="field"><label>結束日期</label><input type="date" id="setEnd"></div>
        <div class="field full"><label>住宿地點名稱</label><input type="text" id="setStayName" placeholder="例如：枕House民宿 D棟"></div>
        <div class="field full"><label>住宿地址</label><input type="text" id="setStayAddr" placeholder="宜蘭縣..."></div>
        <div class="field full"><label>住宿備註 <span class="hint">(可用 **文字** 加粗、!!文字!! 標紅)</span></label><textarea id="setStayNote" placeholder="設備、可代訂項目、注意事項等"></textarea></div>
        <div class="field full">
          <label>住宿照片 <span class="hint">(最多6張，可上傳圖片或貼圖片網址)</span></label>
          <div class="photo-list" id="setStayPhotoList"></div>
          <div class="photo-add-row">
            <input type="file" id="setStayPhotoFile" accept="image/*" multiple>
            <input type="url" id="setStayPhotoUrl" placeholder="或貼上圖片網址後按加入">
            <button type="button" class="btn btn-ghost" id="setStayPhotoUrlAdd">加入</button>
          </div>
        </div>
        <div class="field"><label>Google地圖連結</label><input type="url" id="setStayMaps" placeholder="https://maps.google.com/..."></div>
        <div class="field full"><label>官方網站連結</label><input type="url" id="setStayVideo" placeholder="https://..."></div>
      </div>
      <div class="save-row">
        <button class="btn btn-primary" id="btnSaveSettings">儲存設定</button>
        <span class="save-msg" id="settingsMsg"></span>
      </div>

      <div class="danger-zone">
        <h3>清空所有行程資料</h3>
        <p>會刪除所有候選地點、投票紀錄與行程設定，且無法復原。輸入「清空」以確認。</p>
        <div style="display:flex;gap:8px;">
          <input type="text" id="clearConfirmInput" placeholder="輸入：清空" style="border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:140px;">
          <button class="btn btn-danger" id="btnClearAll">清空所有行程</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">新增地點</h3>
    <div class="field">
      <label>分類</label>
      <div class="type-pick">
        <button type="button" id="typePlay" class="active" data-type="play">玩的</button>
        <button type="button" id="typeFood" data-type="food">吃的</button>
      </div>
    </div>
    <div class="field-grid">
      <div class="field full"><label>地點名稱</label><input type="text" id="fName" placeholder="例如：忍者村"></div>
      <div class="field full"><label>地址</label><input type="text" id="fAddr" placeholder="宜蘭縣..."></div>
      <div class="field full"><label>簡介 <span class="hint">(可用 **文字** 加粗、!!文字!! 標紅)</span></label><textarea id="fBlurb" placeholder="這個地方是做什麼的、特色是什麼"></textarea></div>
      <div class="field"><label>價格</label><input type="text" id="fPrice" placeholder="例如：200元/人"></div>
      <div class="field"><label>預計可停留時間</label><input type="text" id="fTime" placeholder="例如：1小時、0.5–1小時"></div>
      <div class="field">
        <label>距離民宿車程</label>
        <div class="unit-input"><input type="number" min="0" id="fDrive" placeholder="10"><span>分鐘</span></div>
      </div>
      <div class="field">
        <label>距離蘆洲車程 <span class="hint">(選填)</span></label>
        <div class="unit-input"><input type="number" min="0" id="fDriveLuzhou" placeholder="60"><span>分鐘</span></div>
      </div>
      <div class="field">
        <label>室外／室內</label>
        <select id="fIndoor">
          <option value="">未填</option>
          <option value="室外">室外</option>
          <option value="室內">室內</option>
          <option value="皆可">皆可</option>

function getPhotos(obj, singleKey){
  if(obj.photos && obj.photos.length) return obj.photos;
  if(singleKey && obj[singleKey]) return [obj[singleKey]];
  return [];
}

/* ---------- lightbox ---------- */
let lbPhotos = [];
let lbIndex = 0;
const lightboxEl = () => document.getElementById('lightbox');
function openLightbox(photos, startIndex){
  if(!photos || !photos.length) return;
  lbPhotos = photos;
  lbIndex = startIndex || 0;
  renderLightbox();
  lightboxEl().classList.add('active');
}
function closeLightbox(){
  lightboxEl().classList.remove('active');
}
function renderLightbox(){
  document.getElementById('lbImg').src = lbPhotos[lbIndex];
  document.getElementById('lbCounter').textContent = lbPhotos.length>1 ? `${lbIndex+1} / ${lbPhotos.length}` : '';
  const multi = lbPhotos.length>1;
  document.getElementById('lbPrev').style.display = multi ? 'flex' : 'none';
  document.getElementById('lbNext').style.display = multi ? 'flex' : 'none';
}
function initLightboxControls(){
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', ()=>{
    lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length;
    renderLightbox();
  });
  document.getElementById('lbNext').addEventListener('click', ()=>{
    lbIndex = (lbIndex + 1) % lbPhotos.length;
    renderLightbox();
  });
  lightboxEl().addEventListener('click', (e)=>{
    if(e.target === lightboxEl()) closeLightbox();
  });
  document.addEventListener('keydown', (e)=>{
    if(!lightboxEl().classList.contains('active')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
    if(e.key === 'ArrowRight') document.getElementById('lbNext').click();
  });

  let touchStartX = null;
  let touchStartY = null;
  lightboxEl().addEventListener('touchstart', (e)=>{
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  lightboxEl().addEventListener('touchend', (e)=>{
    if(touchStartX === null || lbPhotos.length < 2) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
      if(dx > 0){ document.getElementById('lbPrev').click(); }
      else { document.getElementById('lbNext').click(); }
    }
    touchStartX = null;
    touchStartY = null;
  });
}

function compressImageFile(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function createPhotoManager({fileInputId, urlInputId, urlAddBtnId, listId, getPhotos, setPhotos}){
  function renderList(){
    const listEl = document.getElementById(listId);
    const photos = getPhotos();
    listEl.innerHTML = photos.map((p,i)=>`
      <div class="thumb"><img src="${escapeHtml(p)}"><button type="button" class="rm" data-i="${i}">&times;</button></div>
    `).join('');
    listEl.querySelectorAll('.rm').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const photos2 = getPhotos().slice();
        photos2.splice(Number(btn.dataset.i), 1);
        setPhotos(photos2);
        renderList();
      });
    });
  }
  document.getElementById(fileInputId).addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    let photos = getPhotos().slice();
    for(const file of files){
      if(photos.length >= MAX_PHOTOS){
        toast(`最多只能放 ${MAX_PHOTOS} 張照片`);
        break;
      }
      try{
        const dataUrl = await compressImageFile(file, 480, 0.62);
        photos.push(dataUrl);
      }catch(err){
        console.error('compress failed', err);
      }
    }
    setPhotos(photos);
    renderList();
    e.target.value = '';
  });
  document.getElementById(urlAddBtnId).addEventListener('click', ()=>{
    const urlInput = document.getElementById(urlInputId);
    const url = urlInput.value.trim();
    if(!url) return;
    const photos = getPhotos().slice();
    if(photos.length >= MAX_PHOTOS){
      toast(`最多只能放 ${MAX_PHOTOS} 張照片`);
      return;
    }
    photos.push(url);
    setPhotos(photos);
    urlInput.value = '';
    renderList();
  });
  return { renderList };
}

async function apiPost(payload){
  if(APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    toast('尚未設定 APPS_SCRIPT_URL，請先部署 Apps Script 並貼上網址');
    return false;
  }
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 用text/plain避免CORS預檢請求
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if(data && data.error){
      console.error('api error', data.error);
      toast('儲存失敗：' + data.error);
      return false;
    }
    return true;
  }catch(e){
    console.error('apiPost failed', e);
    toast('儲存失敗，請稍後再試');
    return false;
  }
}

function fmtDate(d){
  if(!d) return '';
  const datePart = String(d).split('T')[0]; // 去掉萬一混進來的時間/時區部分
  const [y,m,day] = datePart.split('-').map(Number);
  if(!y || !m || !day) return String(d);
  const weekday = ['日','一','二','三','四','五','六'][new Date(y, m-1, day).getDay()];
  return `${m}/${day}(${weekday})`;
}

  document.getElementById('tripDatesText').textContent = parts.join('　');
}
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatBlurb(str){
  // 先完整跳脫HTML避免注入，再安全地把 **粗體** 跟 !!紅字!! 轉成標籤
  let s = escapeHtml(str||'');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/!!(.+?)!!/g, '<span class="hl-red">$1</span>');
  return s;
}
function voteCounts(id){
  const v = state.votes[id] || {};
  let yes=0, no=0, neutral=0;
  Object.values(v).forEach(choice => {
    if(choice==='yes') yes++;
    else if(choice==='no') no++;
    else if(choice==='neutral') neutral++;
  });
  return {yes, no, neutral, entries:v};
}
function parseMinutesFromTimeText(text){
  if(!text) return Infinity;
  const m = text.match(/([\d.]+)\s*小時/);
  if(m) return parseFloat(m[1]) * 60;
  const m2 = text.match(/([\d.]+)\s*分鐘/);
  if(m2) return parseFloat(m2[1]);
  return Infinity;
}

function sortedList(){
  const list = state.candidates.filter(c => c.type === currentType);
  const key = sortKey;
  list.sort((a,b)=>{
    let av, bv;
    if(key==='name'){
      av = a.name||''; bv = b.name||'';
      return av.localeCompare(bv, 'zh-Hant') * sortDir;
    }
    if(key==='drive'){ av = (a.drive??Infinity); bv = (b.drive??Infinity); }
    else if(key==='driveLuzhou'){ av = (a.driveLuzhou??Infinity); bv = (b.driveLuzhou??Infinity); }
    else if(key==='time'){ av = parseMinutesFromTimeText(a.time); bv = parseMinutesFromTimeText(b.time); }
    return (av - bv) * sortDir;
  });
  return list;
}

          <button class="vote-btn no ${mine==='no'?'selected':''}" data-id="${c.id}" data-choice="no">
            <span class="n">${no}</span>沒興趣
          </button>
        </div>
        <div class="card-tools admin-only ${isAdmin?'':'hidden'}">
          <button class="icon-btn" data-edit="${c.id}">編輯</button>
        </div>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.vote-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>handleVote(btn.dataset.id, btn.dataset.choice));
  });
  wrap.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>openModal(btn.dataset.edit));
  });
  wrap.querySelectorAll('.photo.clickable[data-photos-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const c = state.candidates.find(x=>x.id===el.dataset.photosId);
      if(c) openLightbox(getPhotos(c, 'photo'));
    });
  });
}

function renderListProgress(list){
  const el = document.getElementById('listProgress');
  if(!state.myName){
    el.innerHTML = `尚未輸入名字，投票不會被記錄。`;
    return;
  }
  if(!list.length){ el.innerHTML = ''; return; }
  const voted = list.filter(c => {
    const v = state.votes[c.id];
    return v && v[state.myName];
  }).length;
  const pct = Math.round((voted/list.length)*100);
  el.innerHTML = `
    你已經投了 ${voted} / ${list.length} 個地點的票
    <span class="bar"><span class="bar-fill" style="width:${pct}%"></span></span>
  `;
}

function renderNextCta(){
  const el = document.getElementById('nextCta');
  if(currentType === 'play'){
    el.innerHTML = `
      <p>這區都看過了嗎？別忘了「吃的」那邊也有候選名單喔！</p>
      <button class="btn btn-primary" id="ctaGoFood">前往「吃的」看看 →</button>
    `;
    document.getElementById('ctaGoFood').addEventListener('click', ()=>{
      selectSubtab('food');
      window.scrollTo({ top: document.getElementById('panel-list').offsetTop - 10, behavior:'smooth' });
    });
  } else {
    el.innerHTML = `
      <p>兩邊都投完了嗎？可以去看看大家目前想去哪裡。</p>
      <button class="btn btn-primary" id="ctaGoStats">查看「統計總覽」→</button>
    `;
    document.getElementById('ctaGoStats').addEventListener('click', ()=>{
      switchTab('stats');
      window.scrollTo({ top: 0, behavior:'smooth' });

function selectSubtab(type){
  currentType = type;
  document.querySelectorAll('#panel-list .subtab').forEach(x=>x.classList.toggle('active', x.dataset.type===type));
  renderCards();
}

let statsType = 'play';

function renderStats(){
  const wrap = document.getElementById('statsWrap');
  if(!state.candidates.length){
    wrap.innerHTML = '<p style="color:var(--ink-soft);font-size:14px;">還沒有候選地點可以統計。</p>';
    return;
  }
  function buildRows(type){
    return state.candidates.filter(c=>c.type===type).map(c=>{
      const {yes, no, neutral, entries} = voteCounts(c.id);
      const yesNames = Object.entries(entries).filter(([,v])=>v==='yes').map(([n])=>n);
      const neutralNames = Object.entries(entries).filter(([,v])=>v==='neutral').map(([n])=>n);
      const noNames = Object.entries(entries).filter(([,v])=>v==='no').map(([n])=>n);
      return {name:c.name, yes, no, neutral, score: yes-no, yesNames, neutralNames, noNames};
    }).sort((a,b)=>b.score-a.score);
  }
  const rows = buildRows(statsType);
  const maxTotal = Math.max(1, ...rows.map(r=>r.yes+r.no+r.neutral));

  if(!rows.length){
    wrap.innerHTML = `<p style="color:var(--ink-soft);font-size:13.5px;">${statsType==='play'?'還沒有「玩的」候選地點。':'還沒有「吃的」候選地點。'}</p>`;
    return;
  }

  wrap.innerHTML = rows.map(r=>{
    const yesPct = (r.yes/maxTotal*100);
    const neutralPct = (r.neutral/maxTotal*100);
    const noPct = (r.no/maxTotal*100);
    const who = [
      r.yesNames.length ? `想去：${r.yesNames.join('、')}` : '',
      r.neutralNames.length ? `都可以：${r.neutralNames.join('、')}` : '',
      r.noNames.length ? `不想去：${r.noNames.join('、')}` : ''
    ].filter(Boolean).join('　');
    return `
    <div class="stat-row">
      <div class="stat-name">
        <h4>${escapeHtml(r.name)}</h4>
        ${who ? `<div class="who">${escapeHtml(who)}</div>` : `<div class="who">尚無投票</div>`}
      </div>
      <div class="bar-wrap"><div class="bar-yes" style="width:${yesPct}%"></div><div class="bar-neutral" style="width:${neutralPct}%"></div><div class="bar-no" style="width:${noPct}%"></div></div>
      <div class="stat-score">${r.score>0?'+':''}${r.score}</div>
    </div>`;
  }).join('');
}

document.querySelectorAll('#panel-stats .subtab').forEach(t=>{
  t.addEventListener('click', ()=>{
    statsType = t.dataset.statType;
    document.querySelectorAll('#panel-stats .subtab').forEach(x=>x.classList.toggle('active', x===t));
    renderStats();
  });
});

async function handleVote(id, choice){
  if(!state.myName){
    toast('請先在右上角輸入你的名字');
    document.getElementById('meName').focus();
    return;
  }
  const votes = JSON.parse(JSON.stringify(state.votes));
  votes[id] = votes[id] || {};
  let sendChoice = choice;
  if(votes[id][state.myName] === choice){
    delete votes[id][state.myName];
    sendChoice = null; // 取消投票
  } else {
    votes[id][state.myName] = choice;
  }
  state.votes = votes;
  renderCards();
  renderStats();
  await apiPost({ action:'vote', candidateId:id, voterName:state.myName, choice:sendChoice });
}

function switchTab(tab){
  if(tab==='settings' && !isAdmin) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+tab));
  if(tab==='stats') renderStats();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>switchTab(t.dataset.tab)));

document.querySelectorAll('#panel-list .subtab').forEach(t=>{
  t.addEventListener('click', ()=>selectSubtab(t.dataset.type));
});

document.getElementById('sortKey').addEventListener('change', (e)=>{
  sortKey = e.target.value;
  renderCards();
});
document.getElementById('sortDir').addEventListener('click', ()=>{
  sortDir *= -1;
  document.getElementById('sortDir').textContent = sortDir===1 ? '↑ 由小到大' : '↓ 由大到小';
  renderCards();
});

/* ---------- admin toggle ---------- */
function applyAdminUI(){
  document.querySelectorAll('.admin-only').forEach(el=>el.classList.toggle('hidden', !isAdmin));
  document.getElementById('adminToggle').textContent = isAdmin ? '結束管理模式' : '管理模式';
  document.getElementById('adminToggle').classList.toggle('on', isAdmin);
  if(!isAdmin){
    const settingsTab = document.querySelector('.tab[data-tab="settings"]');
    if(settingsTab.classList.contains('active')) switchTab('list');
  }
  renderCards();
  renderStayCard();
}
const adminLoginBar = document.getElementById('adminLogin');
const adminPwInput = document.getElementById('adminPwInput');
document.getElementById('adminToggle').addEventListener('click', ()=>{
  if(isAdmin){
    isAdmin = false;
    applyAdminUI();
    return;
  }
  adminLoginBar.classList.toggle('hidden');
  if(!adminLoginBar.classList.contains('hidden')){
    adminPwInput.value = '';
    adminPwInput.focus();
  }
});
document.getElementById('adminPwConfirm').addEventListener('click', ()=>{

    isAdmin = true;
    adminLoginBar.classList.add('hidden');
    applyAdminUI();
    toast('已進入管理模式');
  } else {
    toast('密碼錯誤');
    adminPwInput.value = '';
    adminPwInput.focus();
  }
});
document.getElementById('adminPwCancel').addEventListener('click', ()=>{
  adminLoginBar.classList.add('hidden');
});
adminPwInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('adminPwConfirm').click();
});

/* ---------- settings ---------- */
window._stayPhotos = [];
function fillSettingsForm(){
  const s = state.settings || {};
  document.getElementById('setStart').value = s.start || '';
  document.getElementById('setEnd').value = s.end || '';
  document.getElementById('setStayName').value = s.stayName || '';
  document.getElementById('setStayAddr').value = s.stayAddr || '';
  document.getElementById('setStayNote').value = s.stayNote || '';
  document.getElementById('setStayMaps').value = s.stayMaps || '';
  document.getElementById('setStayVideo').value = s.stayVideo || '';
  document.getElementById('setStayPhotoFile').value = '';
  document.getElementById('setStayPhotoUrl').value = '';
  window._stayPhotos = getPhotos(s, 'stayPhoto').slice();
  stayPhotoManager.renderList();
}

const stayPhotoManager = createPhotoManager({
  fileInputId: 'setStayPhotoFile',
  urlInputId: 'setStayPhotoUrl',
  urlAddBtnId: 'setStayPhotoUrlAdd',
  listId: 'setStayPhotoList',
  getPhotos: () => window._stayPhotos,
  setPhotos: (p) => { window._stayPhotos = p; },
});

function renderStayCard(){
  const wrap = document.getElementById('stayCardWrap');
  const s = state.settings || {};
  if(!s.stayName && !s.start && !s.end){
    wrap.innerHTML = `<div class="empty" style="margin-top:0;margin-bottom:22px;">尚未設定住宿與行程日期。${isAdmin ? '到「行程設定」新增。' : '請管理者到「行程設定」新增。'}</div>`;
    return;
  }
  const photos = getPhotos(s, 'stayPhoto');
  const photoHtml = photos.length
    ? `<img src="${escapeHtml(photos[0])}" alt="">${photos.length>1 ? `<span class="count-badge"><svg width="12" height="12"><use href="#ic-camera"/></svg>${photos.length}</span>` : ''}`
    : `<svg width="28" height="28"><use href="#ic-camera"/></svg>`;
  const links = [];
  if(s.stayMaps) links.push(`<a href="${escapeHtml(s.stayMaps)}" target="_blank" rel="noopener"><svg><use href="#ic-map"/></svg>Google地圖</a>`);
  if(s.stayVideo) links.push(`<a href="${escapeHtml(s.stayVideo)}" target="_blank" rel="noopener"><svg><use href="#ic-play"/></svg>官網</a>`);
  const dateChip = (s.start || s.end) ? `<span class="chip time">${fmtDate(s.start)}～${fmtDate(s.end)}</span>` : '';
  wrap.innerHTML = `
    <div class="spot" style="margin-bottom:24px;max-width:460px;">
      <div class="photo ${photos.length?'clickable':''}" id="stayPhotoClick">${photoHtml}</div>
      <div class="body">
        <h4>住宿：${escapeHtml(s.stayName || '未命名')}</h4>
        <div class="addr">${escapeHtml(s.stayAddr||'')}</div>
        <div class="blurb">${formatBlurb(s.stayNote)}</div>
        <div class="chips">${dateChip}</div>
        ${links.length ? `<div class="links-row">${links.join('')}</div>` : ''}
      </div>
    </div>`;
  if(photos.length){
    document.getElementById('stayPhotoClick').addEventListener('click', ()=>openLightbox(photos));
  }
}

document.getElementById('btnSaveSettings').addEventListener('click', async ()=>{
  const s = {
    start: document.getElementById('setStart').value,
    end: document.getElementById('setEnd').value,
    stayName: document.getElementById('setStayName').value.trim(),
    stayAddr: document.getElementById('setStayAddr').value.trim(),
    stayNote: document.getElementById('setStayNote').value.trim(),
    photos: window._stayPhotos.slice(),
    stayMaps: document.getElementById('setStayMaps').value.trim(),
    stayVideo: document.getElementById('setStayVideo').value.trim(),
  };
  if(cellTooBig(s.photos)){
    toast('住宿照片資料量太大了（超過試算表儲存格上限），請刪掉幾張，或改用貼圖片網址的方式');
    return;
  }
  const ok = await apiPost({ action:'saveSettings', settings:s });
  if(ok){
    state.settings = s;
    renderHeader();
    renderStayCard();
    const msg = document.getElementById('settingsMsg');
    msg.textContent = '已儲存';
    setTimeout(()=>msg.textContent='', 1800);
  }
});

document.getElementById('btnClearAll').addEventListener('click', async ()=>{
  const v = document.getElementById('clearConfirmInput').value.trim();
  if(v !== '清空'){
    toast('請先在欄位輸入「清空」以確認');
    return;
  }
  if(!confirm('確定要清空所有候選地點、投票與行程設定嗎？此動作無法復原。')) return;
  const ok = await apiPost({ action:'clearAll' });
  if(ok){
    const emptySettings = {start:'',end:'',stayName:'',stayAddr:'',stayNote:'',stayMaps:'',stayVideo:'',photos:[]};
    state.candidates = [];
    state.votes = {};
    state.settings = emptySettings;
    document.getElementById('clearConfirmInput').value = '';
    fillSettingsForm();
    renderHeader();
    renderStayCard();
    renderCards();
    renderStats();
    toast('已清空所有行程資料');
  }
});

/* ---------- add / edit modal ---------- */
const overlay = document.getElementById('overlay');
let modalType = 'play';
function setModalType(t){
  modalType = t;
  document.getElementById('typePlay').classList.toggle('active', t==='play');
  document.getElementById('typeFood').classList.toggle('active', t==='food');
}
document.getElementById('typePlay').addEventListener('click', ()=>setModalType('play'));
document.getElementById('typeFood').addEventListener('click', ()=>setModalType('food'));

function openModal(id){
  if(!isAdmin) return;
  editingId = id || null;
  const c = id ? state.candidates.find(x=>x.id===id) : null;
  document.getElementById('modalTitle').textContent = id ? '編輯地點' : '新增地點';
  setModalType(c?.type || currentType);
  document.getElementById('fName').value = c?.name || '';
  document.getElementById('fAddr').value = c?.addr || '';
  document.getElementById('fBlurb').value = c?.blurb || '';
  document.getElementById('fPrice').value = c?.price || '';
  document.getElementById('fTime').value = c?.time || '';
  document.getElementById('fDrive').value = (c?.drive ?? '');
  document.getElementById('fDriveLuzhou').value = (c?.driveLuzhou ?? '');
  document.getElementById('fIndoor').value = c?.indoor || '';
  document.getElementById('fMaps').value = c?.maps || '';
  document.getElementById('fVideo').value = c?.video || '';
  document.getElementById('fPhotoUrl').value = '';
  document.getElementById('fPhotoFile').value = '';
  window._candidatePhotos = getPhotos(c || {}, 'photo').slice();
  candidatePhotoManager.renderList();
  document.getElementById('btnDelete').style.display = id ? 'inline-flex' : 'none';
  overlay.classList.add('active');
}
function closeModal(){ overlay.classList.remove('active'); editingId=null; }
document.getElementById('btnAdd').addEventListener('click', ()=>openModal(null));
document.getElementById('btnCancel').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

const candidatePhotoManager = createPhotoManager({
  fileInputId: 'fPhotoFile',
  urlInputId: 'fPhotoUrl',
  urlAddBtnId: 'fPhotoUrlAdd',
  listId: 'fPhotoList',
  getPhotos: () => window._candidatePhotos || [],
  setPhotos: (p) => { window._candidatePhotos = p; },
});

document.getElementById('btnSave').addEventListener('click', async ()=>{
  const name = document.getElementById('fName').value.trim();
  if(!name){ toast('請至少填寫地點名稱'); return; }
  const driveVal = document.getElementById('fDrive').value;
  const driveLuzhouVal = document.getElementById('fDriveLuzhou').value;
  const data = {
    id: editingId || ('c' + Date.now()),
    type: modalType,
    name,
    addr: document.getElementById('fAddr').value.trim(),
    blurb: document.getElementById('fBlurb').value.trim(),
    price: document.getElementById('fPrice').value.trim(),
    time: document.getElementById('fTime').value.trim(),
    drive: driveVal === '' ? null : Number(driveVal),
    driveLuzhou: driveLuzhouVal === '' ? null : Number(driveLuzhouVal),
    indoor: document.getElementById('fIndoor').value,
    maps: document.getElementById('fMaps').value.trim(),
    video: document.getElementById('fVideo').value.trim(),
    photos: (window._candidatePhotos || []).slice(),
  };
  if(cellTooBig(data.photos)){
    toast('這個地點的照片資料量太大了（超過試算表儲存格上限），請刪掉幾張，或改貼圖片網址');
    return;
  }
  const ok = await apiPost({ action:'saveCandidate', candidate:data });
  if(ok){
    let list = state.candidates.slice();
    if(editingId){
      list = list.map(c => c.id===editingId ? data : c);
    } else {
      list.push(data);
    }
    state.candidates = list;
    currentType = modalType;
    document.querySelectorAll('#panel-list .subtab').forEach(x=>x.classList.toggle('active', x.dataset.type===modalType));
    renderCards();
    closeModal();
    toast('已儲存');
  }
});
document.getElementById('btnDelete').addEventListener('click', async ()=>{
  if(!editingId) return;
  if(!confirm('確定要刪除這個地點嗎？')) return;
  const ok = await apiPost({ action:'deleteCandidate', id:editingId });
  if(ok){
    state.candidates = state.candidates.filter(c=>c.id!==editingId);
    const votes = JSON.parse(JSON.stringify(state.votes));
    delete votes[editingId];
    state.votes = votes;
    renderCards();
    closeModal();
    toast('已刪除');
  }
});

/* ---------- name ---------- */
const meInput = document.getElementById('meName');
let nameTimer;
meInput.addEventListener('input', ()=>{
  clearTimeout(nameTimer);
  nameTimer = setTimeout(()=>{
    state.myName = meInput.value.trim();
    try{ localStorage.setItem(ME_KEY, state.myName); }catch(e){}
    renderCards();
  }, 500);
});

/* ---------- init ---------- */
async function init(){
  const all = await apiGetAll();

  state.settings = Object.assign(
    {start:'',end:'',stayName:'',stayAddr:'',stayNote:'',stayMaps:'',stayVideo:'',photos:[]},
    all.settings || {}
  );
  state.candidates = (all.candidates && all.candidates.length) ? all.candidates : DEFAULT_CANDIDATES;
  state.votes = all.votes || {};
  try{ state.myName = localStorage.getItem(ME_KEY) || ''; }catch(e){ state.myName = ''; }
  meInput.value = state.myName;

  if(!all.candidates || !all.candidates.length){
    await apiPost({ action:'seedDefaults', candidates: DEFAULT_CANDIDATES });
  }

  fillSettingsForm();
  renderHeader();
  applyAdminUI();
  document.getElementById('loading').style.display = 'none';
}
init();
</script>
